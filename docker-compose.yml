services:
  app:
    build:
      context: .
      dockerfile: /Dockerfile
    container_name: pokemon_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  node:
    image: node:20
    container_name: pokemon_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run build"